sans-serif" text-anchor="start" data-box="376,824">random 16-byte salt</text><rect x="872" y="208" width="256" height="192" rx="4" fill="#20232C" stroke="#FF5A36" stroke-width="3" /><text x="896" y="260" font-size="32" font-weight="700" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="872,1128">Sealed card</text><rect x="888" y="276" width="224" height="68" rx="4" fill="url(#seal-hatch)" stroke="none" stroke-width="2" /><rect x="916" y="284" width="168" height="52" rx="4" fill="#0D0E11" stroke="#686E80" stroke-width="2" /><text x="1000" y="322" font-size="32" font-weight="700" fill="#F4F1EA" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" data-box="872,1128">027d8ca3</text><text x="896" y="376" font-size="32" font-weight="400" fill="#A9ACB5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="872,1128">first 8 hex only</text><rect x="72" y="612" width="192" height="264" rx="4" fill="#20232C" stroke="#7CC4FF" stroke-width="3" /><text x="96" y="664" font-size="32" font-weight="700" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="72,264">You tap</text><text x="96" y="708" font-size="32" font-weight="400" fill="#A9ACB5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="72,264">any card</text><rect x="96" y="740" width="24" height="24" rx="4" fill="#0D0E11" stroke="#686E80" stroke-width="2" /><rect x="132" y="740" width="24" height="24" rx="4" fill="#0D0E11" stroke="#686E80" stroke-width="2" /><rect x="168" y="740" width="24" height="24" rx="4" fill="#7CC4FF" stroke="#7CC4FF" stroke-width="2" /><rect x="204" y="740" width="24" height="24" rx="4" fill="#0D0E11" stroke="#686E80" stroke-width="2" /><rect x="328" y="612" width="368" height="264" rx="4" fill="#20232C" stroke="#FF5A36" stroke-width="3" /><text x="352" y="664" font-size="32" font-weight="700" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="328,696">Card flips</text><text x="352" y="708" font-size="32" font-weight="400" fill="#A9ACB5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="328,696">shows guess + salt</text><text x="352" y="764" font-size="32" font-weight="700" fill="#FF5A36" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="start" data-box="328,696">vanilla-candle</text><text x="352" y="812" font-size="32" font-weight="400" fill="#F4F1EA" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="start" data-box="328,696">9c41e07ab2d85f16</text><text x="352" y="852" font-size="32" font-weight="400" fill="#F4F1EA" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="start" data-box="328,696">3ea0b7c45d128f96</text><rect x="760" y="612" width="368" height="264" rx="4" fill="#20232C" stroke="#7CC4FF" stroke-width="3" /><text x="784" y="664" font-size="32" font-weight="700" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="760,1128">Verify panel</text><text x="784" y="708" font-size="32" font-weight="400" fill="#A9ACB5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="760,1128">recomputes the hash</text><text x="784" y="764" font-size="32" font-weight="700" fill="#7CC4FF" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="start" data-box="760,1128">sha256(id:salt)</text><rect x="784" y="792" width="320" height="56" rx="4" fill="rgba(124,196,255,0.14)" stroke="#7CC4FF" stroke-width="2" /><path d="M802 820 L810 829 L824 810" fill="none" stroke="#7CC4FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="840" y="832" font-size="32" font-weight="700" fill="#7CC4FF" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="760,1128">matches the seal</text><rect x="40" y="940" width="1120" height="228" rx="4" fill="#171920" stroke="#FF5A36" stroke-width="2" stroke-dasharray="10 8" /><text x="72" y="992" font-size="32" font-weight="700" fill="#FF5A36" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="start" letter-spacing="1">ROUND 2 ADDS A SECOND SEAL</text><text x="72" y="1040" font-size="32" font-weight="400" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="40,720">It shows one guess openly</text><text x="72" y="1084" font-size="32" font-weight="400" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="40,720">and seals a second guess</text><text x="72" y="1128" font-size="32" font-weight="400" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="40,720">among the other three cards.</text><rect x="732" y="1016" width="84" height="84" rx="4" fill="rgba(255,90,54,0.18)" stroke="#FF5A36" stroke-width="4" /><rect x="836" y="1016" width="84" height="84" rx="4" fill="#0D0E11" stroke="#686E80" stroke-width="2" /><rect x="940" y="1016" width="84" height="84" rx="4" fill="url(#seal-hatch)" stroke="#FF5A36" stroke-width="3" /><rect x="1044" y="1016" width="84" height="84" rx="4" fill="#0D0E11" stroke="#686E80" stroke-width="2" /><text x="774" y="1140" font-size="32" font-weight="400" fill="#A9ACB5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="middle">shown</text><text x="982" y="