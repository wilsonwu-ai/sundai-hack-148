<pattern id="seal-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="16" height="16" fill="#20232C"/><rect width="8" height="16" fill="#3A3F4D"/></pattern></defs>
<rect width="1200" height="1208" fill="#0D0E11"/>
