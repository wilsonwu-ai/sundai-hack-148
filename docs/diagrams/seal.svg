<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="seal-title seal-desc" viewBox="0 0 1200 1208" width="1200" height="1208">
<title id="seal-title">One sealed turn in DEFY</title>
<desc id="seal-desc">Sequence of one turn: the model picks a guess and seals it as a SHA-256 hash of item id and a random salt, a face-down card shows only the first 8 hex characters, the player taps, the card flips to reveal the guess and salt, and the verify panel recomputes the hash and matches it. Round 2 also seals a second guess.</desc>
<defs><style>
