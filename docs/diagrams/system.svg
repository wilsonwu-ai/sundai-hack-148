<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-title system-desc" viewBox="0 0 1200 1264" width="1200" height="1264">
<title id="system-title">DEFY system architecture</title>
<desc id="system-desc">Architecture: a static phone browser app blends an on-device habit model with BehaviorGPT-v4 scores fetched through an optional Cloudflare Worker, falls back to the habit model alone if the live model is slow or fails, and posts anonymous results to Workers KV.</desc>
<defs><style>
@font-face{font-family:'Big Shoulders Display';font-weight:800;src:url('../../node_modules/@fontsource/big-shoulders-display/files/big-shoulders-display-latin-800-normal.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;src:url('../../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2') format('woff2')}
