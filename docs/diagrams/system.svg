<rect width="1200" height="1264" fill="#0D0E11"/>
<text x="40" y="84" font-size="64" font-weight="800" fill="#F4F1EA" font-family="'Big Shoulders Display', Impact, 'Arial Narrow', sans-serif" text-anchor="start" letter-spacing="1">HOW DEFY IS WIRED</text><circle cx="884" cy="70" r="10" fill="#FF5A36"/><text x="906" y="82" font-size="32" font-weight="400" fill="#A9ACB5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start">model</text><circle cx="1036" cy="70" r="10" fill="#7CC4FF"/><text x="1058" y="82" font-size="32" font-weight="400" fill="#A9ACB5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start">you</text><rect x="40" y="124" width="1120" height="440" rx="4" fill="#171920" stroke="#7CC4FF" stroke-width="3" /><text x="72" y="176" font-size="32" font-weight="700" fill="#F4F1EA" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="start" letter-spacing="1" data-box="40,1160">PHONE BROWSER</text><text x="1128" y="176" font-size="32" font-weight="400" fill="#A9ACB5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="end" data-box="40,1160">static site on GitHub Pages</text><text x="72" y="224" font-size="32" font-weight="400" fill="#A9ACB5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="40,1160">game engine · Web Crypto seal</text><text x="600" y="296" font-size="32" font-weight="700" fill="#F4F1EA" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">FALLBACK: habit only</text><path d="M304 442 L352 442" fill="none" stroke="#A9ACB5" stroke-width="3" stroke-linejoin="round" marker-end="url(#system-ah)"/><path d="M848 442 L896 442" fill="none" stroke="#A9ACB5" stroke-width="3" stroke-linejoin="round" marker-end="url(#system-ah)"/><path d="M192 356 L192 320 Q192 312 200 312 L1000 312 Q1008 312 1008 320 L1008 356" fill="none" stroke="#F4F1EA" stroke-width="3" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#system-ah)"/><rect x="80" y="356" width="224" height="172" rx="4" fill="#20232C" stroke="#686E80" stroke-width="3" /><text x="104" y="438" font-size="32" font-weight="700" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="80,304">Habit</text><text x="104" y="482" font-size="32" font-weight="700" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="80,304">model</text><rect x="352" y="356" width="496" height="172" rx="4" fill="#20232C" stroke="#FF5A36" stroke-width="3" /><text x="376" y="408" font-size="32" font-weight="700" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="352,848">Blend</text><text x="376" y="456" font-size="32" font-weight="400" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="352,848">habit logits + z-scored</text><text x="376" y="500" font-size="32" font-weight="400" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="352,848">scores, then softmax</text><rect x="896" y="356" width="224" height="172" rx="4" fill="#20232C" stroke="#686E80" stroke-width="3" /><text x="920" y="438" font-size="32" font-weight="700" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="896,1120">Odds</text><text x="920" y="482" font-size="32" font-weight="700" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="896,1120">per card</text><path d="M480 564 L480 692" fill="none" stroke="#A9ACB5" stroke-width="3" stroke-linejoin="round" marker-start="url(#system-ah)" marker-end="url(#system-ah)"/><path d="M1000 564 L1000 692" fill="none" stroke="#A9ACB5" stroke-width="3" stroke-linejoin="round" marker-start="url(#system-ah)" marker-end="url(#system-ah)"/><text x="464" y="636" font-size="32" font-weight="700" fill="#F4F1EA" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" data-box="0,480">POST /api/rank</text><text x="984" y="620" font-size="32" font-weight="700" fill="#F4F1EA" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" data-box="0,1000">POST /api/result</text><text x="984" y="664" font-size="32" font-weight="700" fill="#F4F1EA" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" data-box="0,1000">GET /api/stats</text><rect x="100" y="692" width="1000" height="172" rx="4" fill="#20232C" stroke="#686E80" stroke-width="3" /><text x="124" y="744" font-size="32" font-weight="700" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="100,1100">Cloudflare Worker (optional)</text><text x="124" y="792" font-size="32" font-weight="400" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="100,1100">holds the API key as a server secret</text><text x="124" y="836" font-size="32" font-weight="400" fill="#A9ACB5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="100,1100">rate-limits /api/rank calls</text><path d="M300 864 L300 992" fill="none" stroke="#FF5A36" stroke-width="3" stroke-linejoin="round" marker-start="url(#system-ahm)" marker-end="url(#system-ahm)"/><path d="M900 864 L900 992" fill="none" stroke="#A9ACB5" stroke-width="3" stroke-linejoin="round" marker-start="url(#system-ah)" marker-end="url(#system-ah)"/><text x="316" y="940" font-size="32" font-weight="700" fill="#F4F1EA" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="start" data-box="300,1200">picks so far</text><text x="916" y="940" font-size="32" font-weight="700" fill="#F4F1EA" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="start" data-box="900,1200">histogram</text><rect x="40" y="992" width="520" height="232" rx="4" fill="#20232C" stroke="#FF5A36" stroke-width="3" /><text x="64" y="1044" font-size="32" font-weight="700" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="40,560">BehaviorGPT-v4 API</text><text x="64" y="1092" font-size="32" font-weight="400" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="40,560">ranks the 4 cards zero-shot</text><text x="64" y="1140" font-size="32" font-weight="400" fill="#A9ACB5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="40,560">on our 96-item catalog,</text><text x="64" y="1184" font-size="32" font-weight="400" fill="#A9ACB5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="40,560">never trained on it</text><rect x="640" y="992" width="520" height="232" rx="4" fill="#20232C" stroke="#686E80" stroke-width="3" /><text x="664" y="1044" font-size="32" font-weight="700" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="640,1160">Workers KV</text><text x="664" y="1092" font-size="32" font-weight="400" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="640,1160">anonymous result</text><text x="664" y="1136" font-size="32" font-weight="400" fill="#F4F1EA" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="640,1160">histogram</text><text x="664" y="1184" font-size="32" font-weight="400" fill="#A9ACB5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-anchor="start" data-box="640,1160">no IP address stored</text>
